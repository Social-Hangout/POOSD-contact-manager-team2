<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Profile – Follow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <img class="logo" src="WebsiteLogo.png" alt="Company logo">
    <nav class="main-nav">
      <a href="contactsmain.html">Home</a>
      <a href="#">Privacy</a>
      <a href="#">About</a>
    </nav>
    <!-- HOOK: see the same note in contactsmain.html — JS fills this
         in with the logged-in user's real name after login. -->
    <div class="user-badge" id="user-name">Firstname Lastname</div>
  </header>

  <div class="page-body">
    <aside class="sidebar">
      <a class="sidebar-btn" href="create-contact.html">Create Contact</a>
      <a class="sidebar-btn" href="contactsmain.html">All Contacts</a>
      <a class="sidebar-btn" href="trashpage.html">Trash</a>
    </aside>

    <main class="content">
      <form>
        
        <div class="profile-top">
          <div class="avatar" id="profile-avatar">FL</div>
          <button type="button" class="field-pill" id="edit-phone" style="flex: 1;">Edit Phone number</button>
        </div>

        <!-- Row 2: first name / last name pills, two even columns -->
        <div class="field-grid">
          <button type="button" class="field-pill" id="edit-firstname">Edit Firstname</button>
          <button type="button" class="field-pill" id="edit-lastname">Edit Lastname</button>
        </div>

        <!-- Row 3: Save / Cancel -->
        <div class="action-row">
          <button type="submit" class="field-pill">Save</button>
          <button type="button" class="field-pill" onclick="window.location.href='contactsmain.html'">Cancel</button>
        </div>
      </form>
    </main>
  </div>

</body>
</html>
