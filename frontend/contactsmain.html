<!--
  contactsmain.html — "Contacts main page" wireframe.

  This is the page a logged-in user lands on: a search bar and
  a list of their contacts. Every page in this project shares
  the same header + sidebar markup. they all look consistent.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contacts – Follow</title>
  <!-- This line is what connects the page to style.css.
       Without it, everything below would render as plain
       black-on-white unstyled text. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER: logo, nav links, logged-in user badge ===== -->
  <header class="site-header">
    <img class="logo" src="logo-placeholder.svg" alt="Company logo">
    <nav class="main-nav">
      <a href="contactsmain.html">Home</a>
      <a href="#">Privacy</a>
      <a href="#">About</a>
    </nav>
    <!-- HOOK: after login, JavaScript should set this element's
         text to the real logged-in user's name, e.g.
         document.getElementById("user-name").textContent =
           user.firstName + " " + user.lastName;
         Until that's wired up, it just shows this placeholder.

         Note: this is an <a> (link) now, not a <div>. A <div> is
         just a plain box with no built-in behavior — clicking it
         does nothing no matter how you style it. An <a> tag is
         what makes something a clickable link; its href="..."
         is where it goes. We kept class="user-badge" so it still
         LOOKS the same (all that pill styling lives in the CSS
         class, not the tag), but now it also acts like a link. -->
    <a class="user-badge" id="user-name" href="userprofile.html">Firstname Lastname</a>
  </header>

  <!-- ===== BODY: sidebar + main content, side by side ===== -->
  <div class="page-body">

    <!-- Sidebar links. "Create Contact" goes to the form page;
         "All Contacts" reloads this page; "Trash" would show
         deleted contacts once that feature exists. -->
    <aside class="sidebar">
      <a class="sidebar-btn" href="create-contact.html">Create Contact</a>
      <a class="sidebar-btn" href="contactsmain.html">All Contacts</a>
      <a class="sidebar-btn" href="trashpage.html">Trash</a>
    </aside>

    <!-- Main panel: search + contact list -->
    <main class="content">
      <!-- HOOK: this search box should trigger a call to your
           search API as the user types (or on Enter), which
           returns matching contacts. Whoever builds that JS
           can find this input by id="contact-search". -->
      <input class="search-bar" type="text" id="contact-search" placeholder="Search contacts...">

      <!-- AI-assisted: empty-state + <template> approach for the contact
     list suggested by Claude, to avoid hardcoding sample contacts -->
      <div class="contact-list" id="contact-list">
        <p class="empty-state" id="empty-state">
          You don't have any contacts yet. Click "Create Contact" to add one.
        </p>
      </div>

      
      <template id="contact-row-template">
        <a class="contact-row" href="userprofile.html">
          <div class="avatar"></div>
          <div>
            <div class="contact-name"></div>
            <div class="contact-phone"></div>
          </div>
        </a>
      </template>
      <!-- Example of a cloned + filled-in row, for reference only:
      <a class="contact-row" href="userprofile.html">
        <div class="avatar">JS</div>
        <div>
          <div class="contact-name">Jane Smith</div>
          <div class="contact-phone">555-123-4567</div>
        </div>
      </a>
      -->
    </main>
  </div>

</body>
</html>
