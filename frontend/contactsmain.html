<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacts – Follow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <img class="logo" src="WebsiteLogo.png" alt="Company logo">
    <nav class="main-nav">
      <a href="contactsmain.html">Home</a>
      <a href="privacy.html">Privacy</a>
      <a href="about.html">About</a>
    </nav>
    <a class="user-badge" id="user-name" href="userprofile.html">Account</a>
  </header>

  <div class="page-body">
    <aside class="sidebar">
      <a class="sidebar-btn" href="create-contact.html">Create Contact</a>
      <a class="sidebar-btn" href="contactsmain.html">All Contacts</a>
      <a class="sidebar-btn" href="trashpage.html">Trash</a>
    </aside>

    <main class="content">
      <input class="search-bar" type="text" id="contact-search" placeholder="Search contacts...">
      <p id="list-message" class="empty-state" style="display:none; padding: 0 0 12px;" role="status"></p>

      <div class="contact-list" id="contact-list">
        <p class="empty-state" id="empty-state">
          You don't have any contacts yet. Click "Create Contact" to add one.
        </p>
      </div>

      <template id="contact-row-template">
        <a class="contact-row" href="userprofile.html">
          <div class="avatar"></div>
          <div>
            <div class="contact-name"></div>
            <div class="contact-phone"></div>
          </div>
        </a>
      </template>
    </main>
  </div>

  <script src="api.js"></script>
  <script>
    const listEl = document.getElementById('contact-list');
    const emptyEl = document.getElementById('empty-state');
    const template = document.getElementById('contact-row-template');
    const messageEl = document.getElementById('list-message');
    let searchTimer = null;

    setUserBadge();

    function renderContacts(contacts) {
      listEl.querySelectorAll('.contact-row').forEach(function (row) {
        row.remove();
      });

      if (!contacts || contacts.length === 0) {
        emptyEl.style.display = 'block';
        emptyEl.textContent = document.getElementById('contact-search').value.trim()
          ? 'No contacts match your search.'
          : 'You don\'t have any contacts yet. Click "Create Contact" to add one.';
        return;
      }

      emptyEl.style.display = 'none';

      contacts.forEach(function (contact) {
        const node = template.content.cloneNode(true);
        const row = node.querySelector('.contact-row');
        const avatar = node.querySelector('.avatar');
        const nameEl = node.querySelector('.contact-name');
        const phoneEl = node.querySelector('.contact-phone');

        row.href = 'userprofile.html?id=' + encodeURIComponent(contact.id);
        avatar.textContent = initials(contact.first_name, contact.last_name);
        nameEl.textContent = (contact.first_name + ' ' + contact.last_name).trim();
        phoneEl.textContent = contact.phone || '';

        listEl.appendChild(node);
      });
    }

    async function loadAllContacts() {
      messageEl.style.display = 'none';
      try {
        const data = await apiPost('/list.php', {});
        if (data.status !== 'success') {
          if ((data.message || '').toLowerCase().includes('not logged in')) {
            requireLoginRedirect();
            return;
          }
          messageEl.style.display = 'block';
          showMessage(messageEl, data.message || 'Failed to load contacts', true);
          return;
        }
        renderContacts(data.contacts || []);
      } catch (err) {
        messageEl.style.display = 'block';
        showMessage(messageEl, err.message || 'Network error', true);
      }
    }

    async function searchContacts(term) {
      messageEl.style.display = 'none';
      try {
        const data = await apiGet('/search.php?q=' + encodeURIComponent(term));
        if (data.status !== 'success') {
          if ((data.status || '').includes('unauth') || (data.message || '').toLowerCase().includes('unauth')) {
            requireLoginRedirect();
            return;
          }
          messageEl.style.display = 'block';
          showMessage(messageEl, data.message || 'Search failed', true);
          return;
        }
        renderContacts(data.contacts || []);
      } catch (err) {
        messageEl.style.display = 'block';
        showMessage(messageEl, err.message || 'Network error', true);
      }
    }

    document.getElementById('contact-search').addEventListener('input', function (e) {
      const term = e.target.value.trim();
      clearTimeout(searchTimer);

      if (term === '') {
        loadAllContacts();
        return;
      }

      searchTimer = setTimeout(function () {
        searchContacts(term);
      }, 250);
    });

    loadAllContacts();
  </script>
</body>
</html>
