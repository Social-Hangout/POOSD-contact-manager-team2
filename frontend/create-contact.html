<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Contact – Follow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <img class="logo" src="logo-placeholder.svg" alt="Company logo">
    <nav class="main-nav">
      <a href="contactsmain.html">Home</a>
      <a href="#">Privacy</a>
      <a href="#">About</a>
    </nav>
    <!-- Hardcoded for now, but later JS will fill in with actual First and Last name. -->
    <div class="user-badge" id="user-name">Firstname Lastname</div>
  </header>

  <div class="page-body">
    <aside class="sidebar">
      <a class="sidebar-btn" href="create-contact.html">Create Contact</a>
      <a class="sidebar-btn" href="contactsmain.html">All Contacts</a>
      <a class="sidebar-btn" href="trashpage.html">Trash</a>
    </aside>

    <main class="content">

      <!-- Back / Save buttons on the wireframe's top corners.
           These are plain <button> elements inside a <form>,
           so "Save" naturally submits the form once a teammate
           wires up the form's action/JavaScript. -->
      <form>
        <div class="form-toolbar">
          <button type="button" class="pill-btn" onclick="window.location.href='contactsmain.html'">Back</button>
          <button type="submit" class="pill-btn">Save</button>
        </div>

        <!-- HOOK: this is a brand-new contact with no name typed
             in yet, so it starts blank (no initials to show).
             Once JS is added, it should update this circle's
             text live as the user types their First/Last name
             below  -->
        <div class="avatar" id="new-contact-avatar" style="margin-bottom: 20px;"></div>

        
        <label for="first-name" class="visually-hidden">First name</label>
        <input class="text-input" type="text" id="first-name" name="first-name" placeholder="Enter First Name">

        <label for="last-name" class="visually-hidden">Last name</label>
        <input class="text-input" type="text" id="last-name" name="last-name" placeholder="Enter Last Name">

        <label for="phone" class="visually-hidden">Phone number</label>
        <input class="text-input" type="tel" id="phone" name="phone" placeholder="Enter Phone Number">
      </form>
    </main>
  </div>

</body>
</html>
