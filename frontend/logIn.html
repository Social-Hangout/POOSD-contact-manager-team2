<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Log in – Follow</title>
</head>
<body>
 
  <header class="site-header">
    <img class="logo" src="WebsiteLogo.png" alt="Follow">
    <nav class="main-nav">
      <a href="main.html">Home</a>
      <a href="privacy.html">Privacy</a>
      <a href="about.html">About</a>
    </nav>
    <a class="login-btn" href="logIn.html">Log in</a>
  </header>
 
  <main class="auth-page">
    <h1 class="auth-title">Welcome!</h1>
 
    <form class="auth-form" action="main.html" method="post">
      <div class="form-field">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
 
      <div class="form-field">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
 
      <button type="submit" class="green-btn auth-btn">Log in</button>
    </form>
 
    <div class="tree-branch">
      <img src="Group 1.png" alt="">
    </div>
  </main>
 
</body>
</html>
